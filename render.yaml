services:
  - type: web
    name: tapzen-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: WEB_ORIGIN
        value: https://tapzen-saas.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_HASH_SECRET
        generateValue: true
      - key: COARENA_TERMS_ACCEPTED_BY_OWNER
        value: "false"
      - key: DATABASE_URL
        sync: false
